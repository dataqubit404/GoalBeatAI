databases:
  - name: goalbeat-postgres
    databaseName: goalbeat_db
    user: goalbeat_user
    plan: free
    region: oregon

services:
  - type: web
    name: goalbeat-ai-backend
    env: node
    region: oregon
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && node server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_FOOTBALL_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: goalbeat-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
